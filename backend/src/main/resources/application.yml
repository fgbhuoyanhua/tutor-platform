server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tutor-platform
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tutor.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:tutor-platform-dev-secret-key-please-change-in-prod-0123456789}
  expire-hours: 168
